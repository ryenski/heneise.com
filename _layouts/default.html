<!doctype html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ site.title }} - {{ page.description | default: page.title }}</title>
    <meta
      name="description"
      content="{{ page.summary | default: page.description | default: site.description }}"
    >
    {% include head-common.html %}
  </head>

  <body class="site">
    {% include masthead.html %}
    <main class="wrap page">
      <header class="page-head">
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.description %}
          <p class="page-sub">{{ page.description }}</p>
        {% endif %}
        {% if page.contact %}
          <p class="page-contact meta">{{ page.contact }}</p>
        {% endif %}
      </header>
      <div class="prose">
        {{ content }}
      </div>
    </main>
    {% include site-footer.html %}
    {% include scripts.html %}
  </body>
</html>
